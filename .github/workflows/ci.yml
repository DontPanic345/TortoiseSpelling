name: CI

# Unit tests, lint and the device-free checks, on every push to main and every pull
# request. release.yml calls this too, so a release can't be built from a commit whose
# tests fail.
#
# The screenshot tests validate on the JVM. # The data layer's instrumented tests run on an API 26 emulator. The Appium e2e suite
# isn't run here: run it locally (see e2e/README.md). ClaudeIntegrationTest is skipped because there's no API key here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # setup-java's own Gradle cache rather than gradle/actions/setup-gradle, whose
          # v6 requires accepting Gradle's separate terms of use for its caching.
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            app/build/reports/
            app/build/test-results/

  scripts:
    name: Release scripts and e2e checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Release script tests
        run: node --test 'scripts/*.test.mjs'

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Every e2e step is defined, and used
        working-directory: e2e
        run: npm run check-steps -- --all

      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck

  data:
    name: Data layer tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 26 is the app's minSdk, so its SQLite (3.18) is the oldest any user has.
      - name: Data layer tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=io.github.dontpanic345.tortoisespelling.data

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: data-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  screenshots:
    name: Screenshot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate screenshots
        run: ./gradlew validateDebugScreenshotTest

      - name: Upload screenshot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-reports
          path: app/build/reports/screenshotTest/
