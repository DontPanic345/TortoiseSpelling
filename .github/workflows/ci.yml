name: CI

# Unit tests, lint and the device-free checks (including web.yml: the web app's typecheck,
# Vitest suite, build and Playwright smoke tests), on every push to main and every pull
# request. release.yml calls this too, so a release can't be built from a commit whose
# tests fail.
#
# The screenshot tests validate on the JVM. The data, component, integration and
# accessibility layers run as instrumented tests on an emulator, one job each. The Appium
# e2e suite isn't run here: run it locally (see e2e/README.md); its release smoke runs from
# release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # setup-java's own Gradle cache rather than gradle/actions/setup-gradle, whose
          # v6 requires accepting Gradle's separate terms of use for its caching.
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            app/build/reports/
            app/build/test-results/

  scripts:
    name: Release scripts and e2e checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Release script tests
        run: node --test 'scripts/*.test.mjs'

      - name: Shared specs are tagged
        run: node scripts/check-specs.mjs

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Every e2e step is defined, and used
        working-directory: e2e
        run: npm run check-steps -- --all

      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck

  web:
    name: Web checks
    uses: ./.github/workflows/web.yml

  instrumented:
    name: ${{ matrix.layer }} tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # API 26 is the app's minSdk, so its SQLite (3.18) and Compose runtime are the
        # oldest any user has. The accessibility checks are about colours, sizes and labels,
        # which don't vary with the API level, and may not run on old APIs at all.
        include:
          - layer: data
            api-level: 26
          - layer: component
            api-level: 26
          - layer: integration
            api-level: 26
          - layer: accessibility
            api-level: 34
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ${{ matrix.layer }} tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=io.github.dontpanic345.tortoisespelling.${{ matrix.layer }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.layer }}-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  screenshots:
    name: Screenshot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate screenshots
        run: ./gradlew validateDebugScreenshotTest

      - name: Upload screenshot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-reports
          path: |
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/
