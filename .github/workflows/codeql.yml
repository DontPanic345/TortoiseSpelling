name: CodeQL

# Static security analysis of the app's Kotlin and of these workflows. Findings appear
# under the repo's Security tab and as annotations on pull requests. The weekly run
# picks up queries GitHub has added since the code last changed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 18 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin needs a real build: with build-mode none, CodeQL skips Kotlin files.
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.build-mode == 'manual'
        with:
          distribution: temurin
          java-version: "17"

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL only sees code that's actually compiled while it watches, so no build
      # cache (which could replay compile tasks from cache) and no daemon.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon --no-build-cache assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
