# The web reminder's push server (push/) deploys on every change to push/, with no
# version. The Durable Object's data survives deploys; never delete the v1 migration.
name: Push server

on:
  push:
    branches: [main]
    paths:
      - "push/**"
      - ".github/workflows/push.yml"
  workflow_dispatch:

concurrency:
  group: push-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  deploy:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the secrets
        id: secrets
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets aren't set; skipping the push server deploy."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.set == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push/package-lock.json
      - if: steps.secrets.outputs.set == 'true'
        run: npm ci
      - name: Deploy
        if: steps.secrets.outputs.set == 'true'
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Create the VAPID key once
        if: steps.secrets.outputs.set == 'true'
        run: |
          if ! npx wrangler secret list | grep -q VAPID_PRIVATE_JWK; then
            node scripts/vapid.mjs | npx wrangler secret put VAPID_PRIVATE_JWK
          fi
      - name: Check the server
        if: steps.secrets.outputs.set == 'true'
        run: |
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $URL"
          curl -fsS "$URL/key" | grep -q publicKey
