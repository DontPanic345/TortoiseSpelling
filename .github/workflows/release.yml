name: Release

# Builds a signed release APK and publishes it to GitHub Releases. There's no Play
# Store distribution for this app -- users sideload the APK from the release page.
#
# To cut a release: run `node scripts/bump-version.mjs <major|minor|patch>`, commit, and
# merge to main. Then tag main with the new version and push the tag (e.g.
# `git tag v1.1.0 && git push origin v1.1.0`).
#
# Nothing is built unless the tag is on main, matches versionName, has a higher
# versionCode than the previous release, and has notes in CHANGELOG.md; and unless the
# CI workflow passes. The release notes are that CHANGELOG.md section.
#
# Tag pushes only, deliberately no workflow_dispatch: the release is named after
# github.ref_name, so a manual run from a branch would publish a release -- and create
# a tag -- called "main".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag and branch: the checks read main and the previous release's tag.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: The tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG isn't on main. Merge the version bump, then tag main."
            exit 1
          fi

      - name: Version and changelog match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$TAG"

  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK for the release asset
        env:
          TAG: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "TortoiseSpelling-$TAG.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "TortoiseSpelling-$TAG.apk" \
            --title "Tortoise Spelling $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
