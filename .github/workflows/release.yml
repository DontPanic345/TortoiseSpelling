name: Release

# Builds a signed release APK and publishes it to GitHub Releases. There's no Play
# Store distribution for this app -- users sideload the APK from the release page.
#
# To cut a release: run `node scripts/bump-version.mjs <major|minor|patch>`, commit, and
# merge to main. Every push to main checks whether versionName already has a v<version>
# tag; if it doesn't, this runs the CI workflow, builds, and only then creates the tag
# along with the release. Nobody pushes tags by hand.
#
# Nothing is built unless versionCode is higher than the previous release's and
# CHANGELOG.md has notes for the version. The release notes are that section. Re-run it
# from the Actions tab (main only) after fixing a failed release.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a second push to main waits rather than racing for the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for a new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag: the checks read the previous release's tag.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Is versionName unreleased?
        id: version
        run: |
          TAG="$(node scripts/check-release.mjs --tag)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version and changelog are ready
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/check-release.mjs "$TAG"

  test:
    name: Tests
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: node scripts/check-release.mjs "$TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK for the release asset
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: cp app/build/outputs/apk/release/app-release.apk "TortoiseSpelling-$TAG.apk"

      # Creates the tag on the built commit, so a tag only ever exists for a release.
      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release create "$TAG" "TortoiseSpelling-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Tortoise Spelling $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
