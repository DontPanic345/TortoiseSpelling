name: Jogging notify

# jogging/jog.mjs appends messages to jogging/outbox.jsonl and pushes. This posts each new
# line as github-actions[bot], which notifies Alan where his own token wouldn't.

on:
  push:
    branches: [main]
    paths: [jogging/outbox.jsonl]

permissions:
  contents: read
  issues: write

concurrency:
  group: jogging-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          git diff --no-color --unified=0 "$BEFORE" "$AFTER" -- jogging/outbox.jsonl \
            | grep '^+{' | cut -c2- > /tmp/new.jsonl || true
          while IFS= read -r line; do
            issue=$(jq -r '.issue // empty' <<<"$line")
            body=$(jq -r '.body' <<<"$line")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$(jq -r '.title' <<<"$line")" --body "$body"
            fi
          done < /tmp/new.jsonl
