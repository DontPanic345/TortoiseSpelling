name: Jogging

# Runs the Jogging crew (jogging/jog.mjs) beside an emulator: one `claude -p` session per
# step, until the budget, the deadline or the work runs out. See jogging/PROTOCOL.md.
#
# Pause after the current step: push "enabled": false in jogging/state.json.
# Stop now: cancel the run; the step stays pending and the next run starts it again.
# Stop the schedule: disable this workflow. The crew disables it itself when The Work is done.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run, or status to check the next step and the pacing without running anything"
        type: choice
        options: [run, status]
        default: run

concurrency:
  group: jogging
  cancel-in-progress: false

permissions:
  contents: read # pushes use JOGGING_GH_TOKEN, so they trigger ci.yml and release.yml
  issues: write # blocker issues and log comments, as github-actions[bot] so they notify Alan
  actions: write # the crew disables this workflow when The Work is done

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GH_TOKEN: ${{ secrets.JOGGING_GH_TOKEN }}
  BOT_TOKEN: ${{ github.token }}
  RECRAFT_API_TOKEN: ${{ secrets.RECRAFT_API_TOKEN }}

jobs:
  jog:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.JOGGING_GH_TOKEN }}
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "Alan Falloon"
          git config user.email falloonalan@gmail.com

      # Pinned: the crew reads the CLI's stream-json output, so an upgrade is a deliberate change.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Status
        if: inputs.command == 'status'
        run: node jogging/jog.mjs status

      - uses: actions/setup-java@v6
        if: inputs.command != 'status'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v7
        if: inputs.command != 'status'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Enable KVM
        if: inputs.command != 'status'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install e2e dependencies
        if: inputs.command != 'status'
        working-directory: e2e
        run: npm ci

      # A throwaway key, as in release-smoke.yml, so `./gradlew assembleRelease` works in a
      # session as it is: the release smoke needs a signed release APK. Never the release secrets.
      - name: Release signing key for sessions
        if: inputs.command != 'status'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/session.keystore" -storepass android -keypass android \
            -alias session -keyalg RSA -keysize 2048 -validity 1 -dname CN=session
          {
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/session.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=android"
            echo "RELEASE_KEY_ALIAS=session"
            echo "RELEASE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      # Downloaded fresh on every run, the system image sometimes fails ("unknown archive")
      # and takes the job with it. ANDROID_HOME is this path on ubuntu-latest.
      - name: Cache the emulator system image
        if: inputs.command != 'status'
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: system-image-34-google_apis-x86_64

      - name: Run the crew
        if: inputs.command != 'status'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node jogging/jog.mjs run

      # A cancelled or timed-out job never reaches the crew's own crash report.
      - name: Report a run that didn't finish
        if: failure() || cancelled()
        run: node jogging/jog.mjs report "Jogging run ${{ github.run_id }} ended ${{ job.status }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/upload-artifact@v7
        if: always() && inputs.command != 'status'
        with:
          name: jogging-runs-${{ github.run_id }}
          path: jogging/runs/
          retention-days: 7
