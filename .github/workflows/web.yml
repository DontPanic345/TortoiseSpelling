name: Web checks

# The web app's typecheck, unit and golden tests, production build, and the Playwright smoke
# suite on that build in Chromium and WebKit. ci.yml and pages.yml call this.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck web
        run: npm run typecheck

      - name: Web unit and golden tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Smoke tests
        run: npm run smoke

      - name: Upload smoke reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-reports
          path: |
            web/playwright-report/
            web/test-results/
