# Weekly dependency update PRs. Minor and patch updates are grouped into one PR per
# ecosystem so they don't bury the repo; majors come one PR each, because they're the
# ones that break things. CI runs on every one of these PRs.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # Kotlin and KSP land together so one PR proves the pair builds. (KSP 2.3+ no
      # longer spells a Kotlin version into its own, but it still has to support ours.)
      kotlin-and-ksp:
        patterns:
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CodeQL builds the app to analyse it, and its Kotlin extractor refuses anything
      # newer than it knows: "Kotlin version 2.4.20 is too recent. CodeQL currently
      # supports versions below 2.4.20". Stay on 2.4.10 until a github/codeql-action
      # release lists 2.4.20 as supported, then remove this.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4.20"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @wdio/cucumber-framework still requires @cucumber/cucumber ^10.3.1 as of its
      # latest release (9.31.9) and its 9.32.0 alpha builds, so a bare devDependency
      # bump to 13.x leaves two incompatible @cucumber/messages copies in the tree:
      # @cucumber/cucumber@13's own @cucumber/pretty-formatter has no declared
      # @cucumber/messages dependency of its own (it assumes the newer one cucumber@13
      # ships alongside), but npm hoists the older @cucumber/messages@26.0.1 that
      # @wdio/cucumber-framework's nested cucumber@10.9.0 needs, and that version has
      # no `HookType` export, so `npm run check-steps` throws
      # "Cannot read properties of undefined (reading 'BEFORE_TEST_RUN')". Watch for a
      # @wdio/cucumber-framework release that drops the ^10.3.1 pin before retrying.
      - dependency-name: "@cucumber/cucumber"
        update-types: ["version-update:semver-major"]
      # The e2e suite runs on Node 22 (CI uses Node 22; README requires 20.19+ or
      # 22.12+). A major @types/node bump tracks a newer Node line and would let code
      # typecheck against APIs that don't exist on the runtime CI actually uses. Bump
      # this once the suite's supported Node major does.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
